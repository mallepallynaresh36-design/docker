
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bus Ticket Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🚌 Bus Ticket Booking</h1>

<div class="container">
    <label>From:</label>
    <input type="text" id="from" placeholder="City">

    <label>To:</label>
    <input type="text" id="to" placeholder="City">

    <label>Date:</label>
    <input type="date" id="date">

    <label>Seats:</label>
    <input type="number" id="seats" min="1" max="6">

    <button onclick="bookTicket()">Book Ticket</button>
</div>

<h2 id="result"></h2>

<script src="script.js"></script>
</body>
</html>
